name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ─── 代码质量检查 ───
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck

  # ─── 单元测试 ───
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx vitest run --reporter=verbose

  # ─── Windows 构建 ───
  build-windows:
    runs-on: windows-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx electron-vite build
      - run: npx electron-builder --win --config electron-builder.yml
      - uses: actions/upload-artifact@v4
        with:
          name: youdu-win
          path: dist/Youdu-*

  # ─── Linux 构建（deb / AppImage / tar.gz）───
  build-linux:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx electron-vite build
      - run: npx electron-builder --linux --config electron-builder.yml
      - uses: actions/upload-artifact@v4
        with:
          name: youdu-linux
          path: |
            dist/Youdu-*.deb
            dist/Youdu-*.AppImage
            dist/Youdu-*.tar.gz

  # ─── macOS 构建（x64 + arm64 dmg）───
  build-macos:
    runs-on: macos-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx electron-vite build
      - run: npx electron-builder --mac --config electron-builder.yml
      - uses: actions/upload-artifact@v4
        with:
          name: youdu-mac
          path: dist/Youdu-*.dmg
